name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: signalahead
          POSTGRES_USER: signalahead
          POSTGRES_PASSWORD: signalahead
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signalahead -d signalahead"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://signalahead:signalahead@localhost:5432/signalahead
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.13'
          cache: pip
          cache-dependency-path: tools/spatial-audit/requirements.txt
      - run: python -m pip install -r tools/spatial-audit/requirements.txt
      - run: npm ci
      - run: npm run check:api
      - run: npm run build:api
      - run: npm run test:api
      - run: python -m unittest discover -s tools/provider-probe -p 'test_*.py' -v
      - run: python -m unittest discover -s tools/spatial-audit -p 'test_*.py' -v
      - run: python -m unittest discover -s tools/contract-check -p 'test_*.py' -v
      - run: python tools/contract-check/validate_replay.py --input fixtures/replay/golden-contract.json

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.3'
          cache: true
      - working-directory: apps/mobile
        run: flutter pub get
      - working-directory: apps/mobile
        run: flutter analyze
      - working-directory: apps/mobile
        run: flutter test
      - working-directory: apps/mobile
        run: flutter build web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - working-directory: apps/mobile
        run: flutter build apk --debug

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.3'
          cache: true
      - working-directory: apps/mobile
        run: flutter pub get
      - working-directory: apps/mobile
        run: flutter build ios --simulator --debug
