name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:api
      - run: npm run test:api
      - run: python -m unittest discover -s tools/provider-probe -p 'test_*.py' -v
      - run: python -m unittest discover -s tools/spatial-audit -p 'test_*.py' -v
      - run: python -m unittest discover -s tools/contract-check -p 'test_*.py' -v
      - run: python tools/contract-check/validate_replay.py --input fixtures/replay/golden-contract.json

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: apps/mobile
        run: flutter pub get
      - working-directory: apps/mobile
        run: flutter analyze
      - working-directory: apps/mobile
        run: flutter test
